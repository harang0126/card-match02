@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#33202b;--bg2:#24151d;--hi:#47293a;--ink:#f9dfe9;--btn:#4a2c3d;--btnh:#5c374b;--b1:#9a5c7b;--b2:#7a4561;--b3:#5e3149;--stitch:rgba(255,255,255,.7);color-scheme:dark}}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Serif KR","Malgun Gothic",serif}
body{background:radial-gradient(circle at 20% 10%,var(--hi),var(--bg) 60%,var(--bg2))}
.screen{display:none;min-height:100vh;padding:20px 14px;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.screen.on{display:flex}
h1{font-size:clamp(30px,8vw,48px);margin:0 0 6px;letter-spacing:.08em}
.sub{opacity:.75;margin:0 0 26px}
.orn{color:var(--gold);letter-spacing:.5em;margin:10px 0}
.lv{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(360px,100%)}

}
async function mkRoom(){const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let c;
 try{for(let k=0;k<5;k++){c=Array.from({length:4},()=>A[Math.random()*A.length|0]).join('');if(!(await rref(c).get()).exists)break}
 await rref(c).set({host:ME,level:0,max:4,status:'lobby',created:Date.now()});await enter(c,await saveName())}catch(e){home('방을 만들 수 없어요. 공유 권한을 확인해 주세요.')}}
async function joinRoom(c){if(c.length!==4)return home('방 코드 4자리를 입력해 주세요.');
 try{const r=await rref(c).get();if(!r.exists)return home('없는 방이에요.');const d=r.data();
  const ps=(await pcol(c).get()).docs.map(x=>x.id);
  if(!ps.includes(ME)){if(d.status!=='lobby')return home('이미 시작된 방이에요.');if(ps.length>=(d.max||4))return home('방이 가득 찼어요.')}
  await enter(c,await saveName())}catch(e){home('참가할 수 없어요. 공유 권한을 확인해 주세요.')}}
async function enter(c,n){exit();MP={code:c,room:null,players:[],names:{},custom:{},gid:null,shown:null,loaded:false};
 const pr=DB.doc('rooms/'+c+'/players/'+ME),ex=await pr.get();if(!ex.exists)await pr.set({joinedAt:Date.now(),name:n||''});else if(n)await pr.update({name:n});
 await lastRef().set({code:c});
 MP.u1=rref(c).onSnapshot(s=>{if(!MP)return;MP.loaded=true;MP.room=s.exists?s.data():null;draw()},()=>{});
 MP.u2=pcol(c).orderBy('joinedAt').onSnapshot(q=>{if(!MP)return;MP.players=q.docs.map(d=>d.id);MP.custom={};q.docs.forEach(d=>{MP.custom[d.id]=d.data().name||''});loadNames().then(draw)},()=>{})}
function exit(){if(MP){MP.u1&&MP.u1();MP.u2&&MP.u2()}MP=null;$('back').textContent='← 처음으로';$('skip').style.display='none'}
async function loadNames(){if(!MP)return;const ids=[...new Set([...MP.players,...((MP.room&&MP.room.order)||[])])];
 try{const ps=await U.profiles(ids);ids.forEach((id,i)=>{MP.names[id]=(ps[id]&&ps[id].name)||'플레이어'+(i+1)})}catch(e){ids.forEach((id,i)=>{MP.names[id]=MP.names[id]||'플레이어'+(i+1)})}}
function draw(){if(!MP||!MP.loaded)return;const r=MP.room;
 if(!r){exit();show('room');home('방이 닫혔어요.');return}
 if(r.status==='lobby'){show('room');lobby();return}
 const l=LV[r.level];
 if(MP.gid!==r.gid){MP.gid=r.gid;buildMp(r,l);show('game')}
 [...$('grid').children].forEach((c,i)=>{c.classList.toggle('f',r.flipped.includes(i)||r.matched.includes(i));c.classList.toggle('m',r.matched.includes(i))});
 const cur=r.order[r.turn];
 $('mv').textContent=cur===ME?'내 차례 ✦':nm(cur)+'님의 차례';
 $('tm').textContent=r.order.map(id=>nm(id)+' '+r.scores[id]).join(' · ');
 $('skip').style.display=r.host===ME&&r.status==='playing'?'':'none';$('back').textContent='← 나가기';
 if(r.status==='done'&&MP.shown!==r.gid){MP.shown=r.gid;win(r)}}
function buildMp(r,l){const g=$('grid');g.innerHTML='';g.style.setProperty('--w',l.w+'px');g.style.gridTemplateColumns=`repeat(${l.c},1fr)`;
 r.deck.forEach((id,i)=>{const d=document.createElement('div');d.className='c';d.innerHTML=`<div class="in"><div class="ba"></div><div class="fa"><img alt="${NAMES[id]}" src="data:image/jpeg;base64,${IMGS[id]}"><span class="nm">${NAMES[id]}</span></div></div>`;d.onclick=()=>mpClick(i);g.appendChild(d)})}
async function mpClick(i){const r=MP&&MP.room;if(!r||r.status!=='playing'||r.order[r.turn]!==ME||MP.busy)return;
 if(r.flipped.length>=2||r.flipped.includes(i)||r.matched.includes(i))return;
 const c=MP.code,fl=[...r.flipped,i];MP.busy=true;
 try{
  if(fl.length<2){await rref(c).update({flipped:fl})}
  else{const ok=r.deck[fl[0]]===r.deck[fl[1]];
   if(!ok){await rref(c).update({flipped:fl});await new Promise(z=>setTimeout(z,600))}
   const q=(MP&&MP.room)||r,m=ok?[...q.matched,...fl]:q.matched,sc={...q.scores};if(ok)sc[ME]++;
   const st=ok?(q.streak||0):0,keep=ok&&st<3&&m.length<q.deck.length;
   await rref(c).update({flipped:[],matched:m,scores:sc,streak:keep?st+1:0,turnStart:Date.now(),turn:keep?q.turn:(q.turn+1)%q.order.length,status:m.length===q.deck.length?'done':'playing'})}
 }catch(e){}
 if(MP)MP.busy=false}
$('skip').onclick=()=>{const r=MP&&MP.room;if(r)rref(MP.code).update({flipped:[],streak:0,turnStart:Date.now(),turn:(r.turn+1)%r.order.length}).catch(()=>{})};
const TL=30;
setInterval(()=>{const r=MP&&MP.room;if(!r||r.status!=='playing'||!MP.gid||MP.busy)return;const cur=r.order[r.turn];if(MP.tsKey!==r.turnStart){MP.tsKey=r.turnStart;MP.tsAt=Date.now()}const rem=Math.ceil(TL-(Date.now()-MP.tsAt)/1000);
 $('mv').textContent=(cur===ME?'내 차례 ✦':nm(cur)+'님의 차례')+' · '+Math.max(0,rem);
 const late=cur===ME?rem<=0:(r.host===ME&&rem<=-4);
 if(late&&MP.passKey!==r.turnStart){MP.passKey=r.turnStart;rref(MP.code).update({flipped:[],streak:0,turn:(r.turn+1)%r.order.length,turnStart:Date.now()}).catch(()=>{})}},250);
function lobby(){if(document.activeElement&&document.activeElement.id==='myn')return;const r=MP.room,host=r.host===ME,b=$('rb');
 b.innerHTML=`<div class="sub" style="margin:0">방 코드</div><div style="font-size:42px;letter-spacing:.2em;font-weight:700">${esc(MP.code)}</div><div id="pl" style="display:grid;gap:6px"></div><input id="myn" maxlength="8" placeholder="닉네임 변경" style="letter-spacing:0;text-transform:none"><div class="sub" style="margin:0">${host?'난이도 (방장만 변경할 수 있어요)':'난이도 (방장이 정해요)'}</div><div class="lv" id="ll"></div><div class="sub" style="margin:0">${host?'인원 (방장만 변경할 수 있어요)':'인원 (방장이 정해요)'}</div><div id="mx" style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center"></div><button id="st"></button><button id="lq">나가기</button>`;
 MP.players.forEach((id,i)=>{const d=document.createElement('div');d.textContent=(i+1)+'. '+(id===r.host?'👑 ':'')+nm(id)+(id===ME?' (나)':'');d.style.cssText='padding:8px;border:1.5px solid var(--gold);border-radius:12px;background:var(--btn)';$('pl').appendChild(d)});
 LV.forEach((l,i)=>{const x=document.createElement('button');x.textContent=l.n;if(i===r.level)x.style.background='var(--b2)';x.disabled=!host;x.onclick=()=>rref(MP.code).update({level:i}).catch(()=>{});$('ll').appendChild(x)});
 const mxv=r.max||4;[2,3,4,5,6,7,8].forEach(n=>{const x=document.createElement('button');x.textContent=n+'명';x.style.padding='8px 12px';if(n===mxv)x.style.background='var(--b2)';x.disabled=!host||n<MP.players.length;x.onclick=()=>rref(MP.code).update({max:n}).catch(()=>{});$('mx').appendChild(x)});const st=$('st');$('myn').value=MP.custom[ME]||'';$('myn').onchange=()=>{const v=$('myn').value.trim().slice(0,8);DB.doc('rooms/'+MP.code+'/players/'+ME).update({name:v}).catch(()=>{});if(v)profRef().set({name:v}).catch(()=>{})};st.textContent=host?(MP.players.length<2?'2명 이상 모이면 시작할 수 있어요':'게임 시작'):'방장이 시작하길 기다리는 중';st.disabled=!host||MP.players.length<2;st.onclick=startMp;$('lq').onclick=leave}
async function startMp(){const r=MP.room;if(r.host!==ME)return;let p0=MP.players;try{p0=(await pcol(MP.code).orderBy('joinedAt').get()).docs.map(x=>x.id)}catch(e){}
 const l=LV[r.level],ids=shuf([...Array(16).keys()]).slice(0,l.p),order=shuf(p0.slice(0,r.max||4));if(order.length<2)return;
 rref(MP.code).update({status:'playing',gid:Date.now(),deck:shuf([...ids,...ids]),order,turn:0,streak:0,turnStart:Date.now(),flipped:[],matched:[],scores:Object.fromEntries(order.map(o=>[o,0]))}).catch(()=>{})}
function win(r){const mx=Math.max(...r.order.map(i=>r.scores[i]));
 $('res').textContent='우승: '+r.order.filter(i=>r.scores[i]===mx).map(nm).join(', ')+'\n'+r.order.map(i=>nm(i)+' '+r.scores[i]+'쌍').join('\n');
 $('again').style.display='';$('home').style.display='';$('again').textContent='다시 한 번';$('wt').textContent='완성!';$('home').textContent='나가기';show('win')}
async function leave(){const c=MP&&MP.code,r=MP&&MP.room,ps=MP?MP.players:[];exit();show('title');
 try{if(c&&r&&r.status==='lobby'){if(r.host===ME){await Promise.all(ps.map(id=>DB.doc('rooms/'+c+'/players/'+id).delete()));await rref(c).delete()}else await DB.doc('rooms/'+c+'/players/'+ME).delete()}
  if(!r||r.status!=='playing')await lastRef().delete()}catch(e){}}
</script></body></html>
